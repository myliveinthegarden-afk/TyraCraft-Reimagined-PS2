name: Check TyraCraft Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "==== REPOSITORY ===="
          ls -lah

      - name: Check ZIP
        run: |
          echo "==== CHECK ZIP ===="

          if [ ! -f "tyracraft-master.zip" ]; then
            echo "ERROR: tyracraft-master.zip tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan!"
          unzip -l tyracraft-master.zip | head -50

      - name: Extract source
        run: |
          echo "==== EXTRACTING ===="
          unzip -q tyracraft-master.zip

          echo "==== HASIL EXTRACT ===="
          ls -lah
          ls -lah tyracraft-master

      - name: Check Makefile
        run: |
          echo "==== CHECK MAKEFILE ===="

          if [ -f "tyracraft-master/Makefile" ]; then
            echo "SUCCESS: Makefile ditemukan!"
            echo ""
            echo "Lokasi:"
            echo "tyracraft-master/Makefile"
          else
            echo "ERROR: Makefile tidak ditemukan!"
            exit 1
          fi
