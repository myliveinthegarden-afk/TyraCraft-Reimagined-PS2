name: Build TyraCraft PS2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            unzip \
            zip \
            wget \
            git

      - name: Check project files
        run: |
          echo "==== PROJECT FILES ===="
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Searching for ZIP files:"
          find . -maxdepth 3 -type f -iname "*.zip" -print

          echo ""
          echo "Searching for Makefiles:"
          find . -type f \( -name "Makefile" -o -name "makefile" \) -print

      - name: Extract source
        run: |
          echo "==== EXTRACTING SOURCE ===="

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo ""
          echo "Isi ZIP:"
          unzip -l "$ZIP_FILE" | head -n 100

          echo ""
          echo "Mengekstrak..."
          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Hasil ekstraksi:"
          find extracted -maxdepth 3 -type f | head -n 100

      - name: Find project directory
        id: project
        run: |
          echo "==== FINDING PROJECT ===="

          MAKEFILE=$(find extracted -type f -name "Makefile" | head -n 1)

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: Makefile tidak ditemukan setelah ekstraksi."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MAKEFILE")

          echo "Makefile ditemukan:"
          echo "$MAKEFILE"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Isi folder project:"
          ls -la "$PROJECT_DIR"

      - name: Check build configuration
        run: |
          echo "==== CHECK BUILD CONFIGURATION ===="

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Makefile:"
          ls -la Makefile

          echo ""
          echo "Mencari Makefile.base:"
          find . -name "Makefile.base" -print

          echo ""
          echo "Isi bagian awal Makefile:"
          head -n 100 Makefile

      - name: Build project
        run: |
          echo "==== STARTING BUILD ===="

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo ""
          echo "Running make..."

          make

      - name: Check build output
        if: always()
        run: |
          echo "==== CHECKING BUILD OUTPUT ===="

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"

            echo "Project contents after build:"
            find . -maxdepth 4 -type f | sort | head -n 200
          else
            echo "Project directory tidak tersedia."
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TyraCraft-PS2-build
          path: |
            extracted/**/*.elf
            extracted/**/*.ELF
            extracted/**/*.irx
            extracted/**/*.IRX
            extracted/**/*.iso
            extracted/**/*.ISO
          if-no-files-found: warn
