name: Build TyraCraft PS2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALL BASIC TOOLS
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            unzip \
            zip \
            curl \
            git \
            build-essential

      # ==========================================
      # 3. DOWNLOAD PREBUILT PS2DEV
      # ==========================================
      - name: Download PS2DEV toolchain
        run: |
          set -eux

          echo "================================"
          echo "INSTALLING PREBUILT PS2DEV"
          echo "================================"

          export PS2DEV=/usr/local/ps2dev

          sudo mkdir -p "$PS2DEV"

          curl -L --fail --retry 3 \
            -o /tmp/ps2dev-latest.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz

          echo "Downloaded file:"
          ls -lh /tmp/ps2dev-latest.tar.gz

          sudo tar -xf /tmp/ps2dev-latest.tar.gz \
            --strip-components=1 \
            -C "$PS2DEV"

      # ==========================================
      # 4. SET PS2 ENVIRONMENT
      # ==========================================
      - name: Configure PS2DEV environment
        run: |
          set -eux

          echo "PS2DEV=/usr/local/ps2dev" >> "$GITHUB_ENV"
          echo "PS2SDK=/usr/local/ps2dev/ps2sdk" >> "$GITHUB_ENV"
          echo "GSKIT=/usr/local/ps2dev/gsKit" >> "$GITHUB_ENV"

          echo "/usr/local/ps2dev/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/ee/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/iop/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/dvp/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/ps2sdk/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 5. VERIFY COMPILER
      # ==========================================
      - name: Verify PS2 compiler
        run: |
          set -eux

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"

          test -d "$PS2DEV"
          test -d "$PS2SDK"

          command -v mips64r5900el-ps2-elf-g++

          mips64r5900el-ps2-elf-g++ --version

      # ==========================================
      # 6. EXTRACT TYRA MASTER
      # ==========================================
      - name: Extract Tyra Master
        run: |
          set -eux

          test -f tyra-master.zip

          rm -rf /tmp/tyra-extract
          mkdir -p /tmp/tyra-extract

          unzip -q tyra-master.zip -d /tmp/tyra-extract

          echo "Searching Makefile.base..."

          TYRA_BASE=$(find /tmp/tyra-extract \
            -type f \
            -name Makefile.base \
            -print -quit)

          test -n "$TYRA_BASE"

          TYRA_DIR=$(dirname "$TYRA_BASE")

          echo "Tyra directory:"
          echo "$TYRA_DIR"

          sudo rm -rf /tyra
          sudo ln -s "$TYRA_DIR" /tyra

          echo "================================"
          echo "VERIFYING TYRA"
          echo "================================"

          ls -la /tyra

          test -f /tyra/Makefile.base
          test -d /tyra/engine

      # ==========================================
      # 7. EXTRACT TYRACRAFT
      # ==========================================
      - name: Extract TyraCraft
        run: |
          set -eux

          test -f tyracraft-master.zip

          rm -rf "$GITHUB_WORKSPACE/tyracraft"

          mkdir -p "$GITHUB_WORKSPACE/tyracraft"

          unzip -q tyracraft-master.zip \
            -d "$GITHUB_WORKSPACE/tyracraft"

          MAKEFILE=$(find "$GITHUB_WORKSPACE/tyracraft" \
            -type f \
            -name Makefile \
            -print -quit)

          test -n "$MAKEFILE"

          PROJECT_DIR=$(dirname "$MAKEFILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "TYRACRAFT PROJECT"
          echo "================================"

          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # ==========================================
      # 8. CHECK BUILD FILES
      # ==========================================
      - name: Inspect project
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "================================"
          echo "MAKEFILE"
          echo "================================"

          sed -n '1,160p' Makefile

          echo ""
          echo "================================"
          echo "RESOURCE DIRECTORY"
          echo "================================"

          find . -maxdepth 2 -type d | sort

          if [ -d res ]; then
            echo "res directory exists"
            find res -maxdepth 2 -type f | head -100
          else
            echo "WARNING: res directory missing"
          fi

      # ==========================================
      # 9. BUILD TYRA ENGINE
      # ==========================================
      - name: Build Tyra Engine
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "================================"
          echo "BUILDING TYRA ENGINE"
          echo "================================"

          make rebuild-engine

      # ==========================================
      # 10. BUILD TYRACRAFT
      # ==========================================
      - name: Build TyraCraft
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "================================"
          echo "BUILDING TYRACRAFT"
          echo "================================"

          make rebuild

      # ==========================================
      # 11. FIND ELF
      # ==========================================
      - name: Find ELF
        if: always()
        run: |
          echo "================================"
          echo "SEARCHING FOR ELF"
          echo "================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -iname "*.elf" -o -iname "*.ELF" \) \
            -print

      # ==========================================
      # 12. UPLOAD RESULT
      # ==========================================
      - name: Upload TyraCraft ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TyraCraft-PS2-ELF
          path: |
            tyracraft/**/*.elf
            tyracraft/**/*.ELF
          if-no-files-found: error
          retention-days: 30
