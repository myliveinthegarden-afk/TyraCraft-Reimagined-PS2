name: Extract Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP files
        run: |
          echo "===== CHECKING FILES ====="
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "===== ZIP FILES ====="
          find . -type f \( -iname "*.zip" \) -print

      - name: Create extraction directory
        run: |
          mkdir -p extracted

      - name: Extract tyra-master.zip
        run: |
          echo "===== EXTRACTING TYRA MASTER ====="

          ZIP_FILE=$(find . -type f -iname "tyra-master.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tyra-master.zip tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted/tyra-master

          echo "===== TYRA MASTER EXTRACTED ====="
          find extracted/tyra-master -maxdepth 3 -type f | head -n 100

      - name: Extract tyracraft-master.zip
        run: |
          echo "===== EXTRACTING TYRACRAFT ====="

          ZIP_FILE=$(find . -type f -iname "tyracraft-master.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tyracraft-master.zip tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted/tyracraft

          echo "===== TYRACRAFT EXTRACTED ====="
          find extracted/tyracraft -maxdepth 3 -type f | head -n 100

      - name: Show complete extraction structure
        run: |
          echo "================================="
          echo "===== EXTRACTION COMPLETE ====="
          echo "================================="

          echo ""
          echo "===== FOLDERS ====="
          find extracted -type d | sort | head -n 200

          echo ""
          echo "===== IMPORTANT BUILD FILES ====="
          find extracted \
            \( -iname "Makefile" -o -iname "Makefile.base" -o -iname "CMakeLists.txt" \) \
            -print | sort

      - name: Upload extracted sources
        uses: actions/upload-artifact@v4
        with:
          name: extracted-sources
          path: extracted/
          retention-days: 7
