name: Build TyraCraft PS2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TyraCraft source
        run: |
          set -e

          unzip -q tyracraft-master.zip

          echo "=== TyraCraft ==="
          ls -la tyracraft-master

      - name: Clone Tyra Engine
        run: |
          set -e

          git clone --depth 1 https://github.com/h4570/tyra.git "$GITHUB_WORKSPACE/tyra"

          echo "=== Tyra ==="
          ls -la "$GITHUB_WORKSPACE/tyra"
          ls -la "$GITHUB_WORKSPACE/tyra/engine"

      - name: Install Tyra at /tyra
        run: |
          set -e

          sudo ln -s "$GITHUB_WORKSPACE/tyra" /tyra

          echo "=== CHECK /tyra ==="
          ls -la /tyra
          test -f /tyra/Makefile.base
          test -f /tyra/engine/Makefile

      - name: Install PS2DEV
        run: |
          set -e

          wget -O /tmp/ps2dev.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz

          mkdir -p "$HOME/ps2dev"
          tar -xzf /tmp/ps2dev.tar.gz -C "$HOME/ps2dev"

          COMPILER=$(find "$HOME/ps2dev" \
            -type f \
            -name "mips64r5900el-ps2-elf-g++" \
            -print -quit)

          if [ -z "$COMPILER" ]; then
            echo "ERROR: PS2 compiler tidak ditemukan!"
            exit 1
          fi

          PS2_ROOT=$(dirname "$(dirname "$COMPILER")")

          echo "PS2DEV=$PS2_ROOT" >> "$GITHUB_ENV"
          echo "PS2SDK=$PS2_ROOT/ps2sdk" >> "$GITHUB_ENV"
          echo "$PS2_ROOT/bin" >> "$GITHUB_PATH"

      - name: Verify PS2 compiler
        run: |
          set -e

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"

          which mips64r5900el-ps2-elf-g++
          mips64r5900el-ps2-elf-g++ --version

      - name: Build Tyra Engine
        run: |
          set -e

          cd /tyra/engine

          echo "=== BUILD TYRA ENGINE ==="
          make

      - name: Build TyraCraft
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/tyracraft-master"

          echo "=== BUILD TYRACRAFT ==="
          make clean || true
          make

      - name: Find ELF
        run: |
          echo "=== ELF OUTPUT ==="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.elf" \
            -print

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: TyraCraft-PS2-ELF
          path: tyracraft-master/bin/*.elf
          if-no-files-found: error
