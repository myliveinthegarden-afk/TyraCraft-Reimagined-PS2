name: Check TyraCraft ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "==== FILE DI REPOSITORY ===="
          ls -lah

      - name: Check ZIP file
        run: |
          echo "==== MENCARI FILE ZIP ===="
          
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo ""
          echo "==== ISI FILE ZIP ===="
          unzip -l "$ZIP_FILE"

      - name: Finish
        run: |
          echo "==== PEMERIKSAAN SELESAI ===="
