name: Build TyraCraft PS2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL BASIC DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            make \
            cmake \
            git \
            wget \
            curl \
            file \
            tree


      # ============================================================
      # 3. CHECK FILES IN REPOSITORY
      # ============================================================

      - name: Check repository files
        run: |
          set -eux

          echo "================================"
          echo "REPOSITORY FILES"
          echo "================================"

          pwd

          ls -lah

          echo ""
          echo "================================"
          echo "SEARCHING FOR ZIP FILES"
          echo "================================"

          find . -maxdepth 3 -type f \
            -iname "*.zip" -o -iname "*.ZIP" \
            -print


      # ============================================================
      # 4. VERIFY TYRA ZIP
      # ============================================================

      - name: Check Tyra ZIP
        run: |
          set -eux

          echo "================================"
          echo "CHECKING TYRA ZIP"
          echo "================================"

          if [ ! -f "tyra-master.zip" ]; then
            echo "ERROR: tyra-master.zip not found"
            exit 1
          fi

          unzip -t tyra-master.zip

          echo ""
          echo "================================"
          echo "TYRA ZIP CONTENT"
          echo "================================"

          unzip -l tyra-master.zip | head -100


      # ============================================================
      # 5. VERIFY TYRACRAFT ZIP
      # ============================================================

      - name: Check TyraCraft ZIP
        run: |
          set -eux

          echo "================================"
          echo "CHECKING TYRACRAFT ZIP"
          echo "================================"

          if [ ! -f "tyracraft-master.zip" ]; then
            echo "ERROR: tyracraft-master.zip not found"
            exit 1
          fi

          unzip -t tyracraft-master.zip

          echo ""
          echo "================================"
          echo "TYRACRAFT ZIP CONTENT"
          echo "================================"

          unzip -l tyracraft-master.zip | head -100


      # ============================================================
      # 6. EXTRACT BOTH PROJECTS
      # ============================================================

      - name: Extract source files
        run: |
          set -eux

          echo "================================"
          echo "EXTRACTING TYRA"
          echo "================================"

          mkdir -p extracted/tyra

          unzip -q tyra-master.zip \
            -d extracted/tyra


          echo "================================"
          echo "EXTRACTING TYRACRAFT"
          echo "================================"

          mkdir -p extracted/tyracraft

          unzip -q tyracraft-master.zip \
            -d extracted/tyracraft


          echo "================================"
          echo "EXTRACTION COMPLETE"
          echo "================================"

          find extracted \
            -maxdepth 3 \
            -type d \
            -print


      # ============================================================
      # 7. FIND ACTUAL TYRA DIRECTORY
      # ============================================================

      - name: Find Tyra directory
        run: |
          set -eux

          echo "================================"
          echo "SEARCHING FOR TYRA DIRECTORY"
          echo "================================"

          TYRA_DIR=""

          if [ -f "extracted/tyra/tyra-master/Makefile" ]; then
            TYRA_DIR="extracted/tyra/tyra-master"
          else
            TYRA_DIR=$(find extracted/tyra \
              -type f \
              -name "Makefile" \
              -printf '%h\n' \
              | head -1)
          fi

          if [ -z "$TYRA_DIR" ]; then
            echo "ERROR: Tyra Makefile not found"
            exit 1
          fi

          echo "TYRA_DIR=$TYRA_DIR"

          echo "TYRA_DIR=$TYRA_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "================================"
          echo "TYRA FILES"
          echo "================================"

          ls -lah "$TYRA_DIR"


      # ============================================================
      # 8. FIND ACTUAL TYRACRAFT DIRECTORY
      # ============================================================

      - name: Find TyraCraft directory
        run: |
          set -eux

          echo "================================"
          echo "SEARCHING FOR TYRACRAFT DIRECTORY"
          echo "================================"

          PROJECT_DIR=""

          if [ -f "extracted/tyracraft/tyracraft-master/Makefile" ]; then
            PROJECT_DIR="extracted/tyracraft/tyracraft-master"
          else
            PROJECT_DIR=$(find extracted/tyracraft \
              -type f \
              -name "Makefile" \
              -printf '%h\n' \
              | head -1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: TyraCraft Makefile not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "================================"
          echo "TYRACRAFT FILES"
          echo "================================"

          ls -lah "$PROJECT_DIR"


      # ============================================================
      # 9. CHECK PROJECT CONFIGURATION
      # ============================================================

      - name: Check build configuration
        run: |
          set -eux

          echo "================================"
          echo "TYRA DIRECTORY"
          echo "================================"

          echo "$TYRA_DIR"

          echo ""
          echo "================================"
          echo "TYRACRAFT DIRECTORY"
          echo "================================"

          echo "$PROJECT_DIR"

          echo ""
          echo "================================"
          echo "TYRA MAKEFILE"
          echo "================================"

          sed -n '1,160p' \
            "$TYRA_DIR/Makefile" || true

          echo ""
          echo "================================"
          echo "TYRACRAFT MAKEFILE"
          echo "================================"

          sed -n '1,200p' \
            "$PROJECT_DIR/Makefile" || true


      # ============================================================
      # 10. START PS2DEV CONTAINER
      # ============================================================

      - name: Pull PS2 development environment
        run: |
          set -eux

          echo "================================"
          echo "DOWNLOADING PS2 TOOLCHAIN"
          echo "================================
