name: Build TyraCraft ELF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. SHOW REPOSITORY FILES
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "REPOSITORY FILES"
          echo "================================"

          pwd

          echo ""
          echo "Root directory:"
          ls -lah

          echo ""
          echo "Searching for ZIP files:"
          find . -maxdepth 3 -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print


      # ============================================================
      # 3. INSTALL HOST DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            file \
            tree


      # ============================================================
      # 4. EXTRACT ALL ZIP FILES
      # ============================================================
      - name: Extract source archives
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf extracted
          mkdir -p extracted

          echo "================================"
          echo "EXTRACTING ZIP FILES"
          echo "================================"

          found=0

          while IFS= read -r -d '' zipfile; do

            found=1

            filename="$(basename "$zipfile")"
            folder="${filename%.*}"

            echo ""
            echo "--------------------------------"
            echo "Extracting: $zipfile"
            echo "Destination: extracted/$folder"
            echo "--------------------------------"

            mkdir -p "extracted/$folder"

            unzip -q "$zipfile" \
              -d "extracted/$folder"

          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No ZIP files found."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "EXTRACTION COMPLETE"
          echo "================================"

          find extracted \
            -maxdepth 4 \
            -type f \
            | head -n 200


      # ============================================================
      # 5. FIND TYRA AND TYRACRAFT
      # ============================================================
      - name: Find Tyra and TyraCraft directories
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "SEARCHING FOR TYRA"
          echo "================================"

          TYRA_MAKEFILE_BASE="$(
            find extracted \
              -type f \
              -name "Makefile.base" \
              -print \
              | head -n 1
          )"

          if [ -z "$TYRA_MAKEFILE_BASE" ]; then
            echo "ERROR: Tyra Makefile.base was not found."
            exit 1
          fi

          TYRA_DIR="$(dirname "$TYRA_MAKEFILE_BASE")"

          echo "TYRA_DIR=$TYRA_DIR"

          echo ""
          echo "================================"
          echo "SEARCHING FOR TYRACRAFT"
          echo "================================"

          TYRACRAFT_MAKEFILE="$(
            grep -rl \
              --include="Makefile" \
              "rebuild-engine" \
              extracted \
              | head -n 1 || true
          )"

          if [ -z "$TYRACRAFT_MAKEFILE" ]; then
            echo "ERROR: TyraCraft Makefile was not found."
            exit 1
          fi

          TYRACRAFT_DIR="$(dirname "$TYRACRAFT_MAKEFILE")"

          echo "TYRACRAFT_DIR=$TYRACRAFT_DIR"

          echo ""
          echo "================================"
          echo "FOUND DIRECTORIES"
          echo "================================"

          echo "Tyra:"
          echo "$TYRA_DIR"

          echo ""
          echo "TyraCraft:"
          echo "$TYRACRAFT_DIR"

          echo ""
          echo "Tyra files:"
          ls -lah "$TYRA_DIR"

          echo ""
          echo "TyraCraft files:"
          ls -lah "$TYRACRAFT_DIR"

          echo "TYRA_DIR=$TYRA_DIR" >> "$GITHUB_ENV"
          echo "TYRACRAFT_DIR=$TYRACRAFT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. CHECK MAKEFILES
      # ============================================================
      - name: Check build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "TYRA MAKEFILE.BASE"
          echo "================================"

          test -f "$TYRA_DIR/Makefile.base"

          head -n 80 "$TYRA_DIR/Makefile.base" || true

          echo ""
          echo "================================"
          echo "TYRACRAFT MAKEFILE"
          echo "================================"

          test -f "$TYRACRAFT_DIR/Makefile"

          head -n 120 "$TYRACRAFT_DIR/Makefile"


      # ============================================================
      # 7. DOWNLOAD PS2DEV CONTAINER
      # ============================================================
      - name: Pull PS2 development environment
        shell: bash
        run: |
          set -euxo pipefail

          docker pull ps2dev/ps2dev:latest


      # ============================================================
      # 8. VERIFY PS2 TOOLCHAIN
      # ============================================================
      - name: Verify PS2 build environment
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            ps2dev/ps2dev:latest \
            sh -lc '
              set -eux

              echo "================================"
              echo "PS2DEV ENVIRONMENT"
              echo "================================"

              echo "PATH:"
              echo "$PATH"

              echo ""
              echo "Checking make:"
              command -v make
              make --version

              echo ""
              echo "Checking PS2 compiler:"
              command -v mips64r5900el-ps2-elf-g++
              mips64r5900el-ps2-elf-g++ --version

              echo ""
              echo "PS2DEV:"
              echo "${PS2DEV:-NOT_SET}"

              echo ""
              echo "PS2SDK:"
              echo "${PS2SDK:-NOT_SET}"

              echo ""
              echo "Environment verified successfully."
            '


      # ============================================================
      # 9. PREPARE BUILD ENVIRONMENT
      # ============================================================
      - name: Prepare Tyra environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "PREPARING BUILD ENVIRONMENT"
          echo "================================"

          echo "Tyra directory:"
          echo "$TYRA_DIR"

          echo ""
          echo "TyraCraft directory:"
          echo "$TYRACRAFT_DIR"

          test -f "$TYRA_DIR/Makefile.base"
          test -f "$TYRACRAFT_DIR/Makefile"

          echo ""
          echo "Preparation successful."


      # ============================================================
      # 10. BUILD TYRA ENGINE
      #
      # IMPORTANT:
      # rebuild-engine IS NOT run here.
      # That target belongs to TyraCraft's Makefile.
      # ============================================================
      - name: Build Tyra Engine
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/$TYRA_DIR:/tyra" \
            -w /tyra/engine \
            ps2dev/ps2dev:latest \
            sh -lc '
              set -eux

              echo "================================"
              echo "BUILDING TYRA ENGINE"
              echo "================================"

              echo ""
              echo "Current directory:"
              pwd

              echo ""
              echo "Directory contents:"
              ls -lah

              echo ""
              echo "Checking Makefile..."

              if [ ! -f Makefile ]; then
                echo "ERROR: Engine Makefile not found."
                exit 1
              fi

              echo ""
              echo "Checking build tools..."

              command -v make
              command -v mips64r5900el-ps2-elf-g++

              echo ""
              echo "Cleaning engine..."

              make clean || true

              echo ""
              echo "Building engine..."

              make -j"$(nproc)"

              echo ""
              echo "TYRA ENGINE BUILD COMPLETE"
            '


      # ============================================================
      # 11. BUILD TYRACRAFT
      #
      # This is where rebuild-engine belongs.
      # ============================================================
      - name: Build TyraCraft
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/$TYRA_DIR:/tyra" \
            -v "$GITHUB_WORKSPACE/$TYRACRAFT_DIR:/tyracraft" \
            -w /tyracraft \
            ps2dev/ps2dev:latest \
            sh -lc '
              set -eux

              echo "================================"
              echo "BUILDING TYRACRAFT"
              echo "================================"

              echo ""
              echo "Current directory:"
              pwd

              echo ""
              echo "Directory contents:"
              ls -lah

              echo ""
              echo "Checking Tyra environment:"

              test -f /tyra/Makefile.base

              echo "Tyra Makefile.base found."

              echo ""
              echo "Checking TyraCraft Makefile:"

              test -f Makefile

              echo ""
              echo "Checking tools:"

              command -v make
              command -v mips64r5900el-ps2-elf-g++

              echo ""
              echo "================================"
              echo "REBUILDING TYRA ENGINE"
              echo "================================"

              make rebuild-engine

              echo ""
              echo "================================"
              echo "REBUILDING TYRACRAFT"
              echo "================================"

              make rebuild

              echo ""
              echo "TYRACRAFT BUILD COMPLETE"
            '


      # ============================================================
      # 12. FIND GENERATED ELF
      # ============================================================
      - name: Find generated ELF
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "SEARCHING FOR ELF"
          echo "================================"

          mkdir -p build-output

          find "$TYRACRAFT_DIR" \
            -type f \
            \( \
              -iname "*.elf" \
              -o -iname "*.ELF" \
            \) \
            -print \
            -exec file {} \; \
            | tee elf-search.txt

          ELF_FILE="$(
            find "$TYRACRAFT_DIR" \
              -type f \
              \( \
                -iname "*.elf" \
                -o -iname "*.ELF" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$ELF_FILE" ]; then
            echo "ERROR: No ELF file was generated."
            exit 1
          fi

          echo ""
          echo "ELF FOUND:"
          echo "$ELF_FILE"

          cp "$ELF_FILE" build-output/TyraCraft.elf

          echo "ELF_FILE=$ELF_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 13. VERIFY FINAL ELF
      # ============================================================
      - name: Verify final ELF
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "VERIFYING FINAL ELF"
          echo "================================"

          test -f build-output/TyraCraft.elf

          file build-output/TyraCraft.elf

          ls -lh build-output/TyraCraft.elf

          echo ""
          echo "ELF VERIFIED SUCCESSFULLY."


      # ============================================================
      # 14. UPLOAD ELF AS ARTIFACT
      # ============================================================
      - name: Upload TyraCraft ELF
        uses: actions/upload-artifact@v4
        with:
          name: TyraCraft-ELF
          path: build-output/TyraCraft.elf
          if-no-files-found: error


      # ============================================================
      # 15. COMMIT FINAL ELF TO REPOSITORY
      # ============================================================
      - name: Commit generated ELF
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p releases

          cp build-output/TyraCraft.elf \
            releases/TyraCraft.elf
